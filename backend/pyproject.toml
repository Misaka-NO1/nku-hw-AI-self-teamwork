[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "nku-campus-assistant-backend"
version = "0.1.0"
description = "Backend and MCP foundation for the NKU campus assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jsonschema[format]==4.26.0",
  "mcp[cli]==2.2.0",
  "pydantic-settings==2.15.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]
