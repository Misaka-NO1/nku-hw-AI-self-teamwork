<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>津南 · 校园漫游</title><link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<header class="topbar"><div class="brand"><span class="seal">南<br>开</span><div><h1>津南 · 校园漫游</h1><p>NANKAI / CAMPUS ATLAS</p></div></div><div class="header-end"><span id="version-badge" class="badge">坐标校正粗模 · v0.2</span><a id="model-download" href="nku-jinnan-calibrated.glb" download>下载三维模型 ↗</a></div></header>
<main>
  <section class="viewer" aria-label="可交互的三维校园地图">
    <div id="canvas-host"></div><div id="labels"></div>
    <div class="map-heading"><span class="eyebrow">一座校园，慢慢发现</span><h2>在津南，<br>留住一处风景。</h2><p>俯瞰校园 · 标记你的拍摄地点</p></div>
    <div class="north" title="N 表示北向；指北针随视角变化"><span id="north-arrow">↑</span><b>N</b></div>
    <div class="view-modes"><button id="oblique" class="active">立体视角</button><button id="top">俯视地图</button><label><input id="show-labels" type="checkbox" checked> 景点名称</label></div>
    <div class="map-tools"><button id="zoom-in" aria-label="放大地图">＋</button><button id="zoom-out" aria-label="缩小地图">−</button><button id="reset" aria-label="回到全校视图">⌂</button></div>
    <div id="placing" hidden>点击地图，选择景点的位置。<button id="cancel-place">取消</button></div>
    <div class="map-bottom"><span>左键拖动：以鼠标位置旋转 · 右键拖动平移 · 滚轮缩放<br>触屏：单指旋转 · 双指缩放与平移</span><span id="model-stats"></span></div>
  </section>
  <aside>
    <div class="panel-head"><span class="eyebrow">CAMPUS SCENIC ATLAS</span><h2>校园景点 <span id="spot-count">00</span></h2><p>把花期、光线和回忆，放回地图上。</p><button id="add" class="primary" hidden>＋ 添加景点</button></div>
    <label class="search"><span>⌕</span><input id="search" placeholder="搜索景点或校园建筑" aria-label="搜索景点或校园建筑"></label>
    <div id="building-controls" class="building-controls">
      <label for="building-type">按建筑用途查看</label>
      <select id="building-type"><option value="all">全部类型</option></select>
      <p id="building-summary"></p>
      <p class="local-note">屋顶颜色表示用途，不代表实物颜色；组团不等于单栋。</p>
    </div>
    <div id="spot-list"></div><section id="detail" hidden></section>
    <div id="data-tools" class="data-tools" hidden><button id="export-json">导出景点</button><button id="import-json">导入景点</button><input id="json-file" type="file" accept=".json,application/json" hidden></div>
    <div id="status" role="status" aria-live="polite"></div>
  </aside>
</main>
<dialog id="spot-dialog"><form id="spot-form"><div class="dialog-head"><div><span class="eyebrow">SAVE A PLACE</span><h2 id="dialog-title">添加一处风景</h2></div><button id="close-dialog" type="button" aria-label="关闭">×</button></div>
  <p id="point-coordinate"></p><label>景点名称 <span>*</span><input name="name" required maxlength="80" placeholder="例如：图书馆旁的樱花"></label>
  <label>景点介绍<textarea name="description" maxlength="1000" rows="3" placeholder="描述环境、拍摄方向或你的发现"></textarea></label>
  <div class="form-row"><label>花种 / 分类<input name="flower" maxlength="80" placeholder="樱花、湖景、建筑…"></label><label>建议时间<input name="season_note" maxlength="120" placeholder="例如：4月上旬"></label></div>
  <label>实景照片（可多选，项目最多 100 张）<input id="photo-file" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
  <div id="photo-preview" class="photo-drafts" hidden></div>
  <p id="form-error" role="alert"></p><div class="dialog-actions"><button id="cancel-dialog" type="button">取消</button><button type="submit" class="primary">保存景点</button></div>
</form></dialog>
<dialog id="scenic-dialog" class="scenic-dialog" aria-labelledby="scenic-title">
  <button id="scenic-close" class="scenic-close" type="button" aria-label="关闭景点详情">×</button>
  <div class="scenic-layout">
    <div class="scenic-visual"><div id="scenic-hero" class="scenic-hero"></div><div id="scenic-thumbs" class="scenic-thumbs"></div></div>
    <article class="scenic-story"><div class="scenic-content"><span class="scenic-kicker">津南 · 实景档案</span><h2 id="scenic-title"></h2>
      <p id="scenic-flower" class="scenic-flower"></p><p id="scenic-description" class="scenic-description"></p>
      <p id="scenic-season" class="scenic-season"></p></div><div id="scenic-actions" class="scenic-actions" hidden><button id="scenic-edit" type="button">编辑景点</button><button id="scenic-delete" type="button">删除景点</button></div>
    </article>
  </div>
</dialog>
<noscript>请启用 JavaScript 以查看三维模型。</noscript><script type="module" src="app.mjs"></script>
</body></html>
